<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venora Jewels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202610051407">
<meta name="description" content="Venora Jewels — 100% IGI certified lab grown diamond jewellery in hallmarked 9KT, 14KT & 18KT gold, made in Surat.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Venora Jewels">
<meta property="og:title" content="Venora Jewels">
<meta property="og:description" content="Venora Jewels — 100% IGI certified lab grown diamond jewellery in hallmarked 9KT, 14KT & 18KT gold, made in Surat.">
<meta property="og:url" content="https://www.venorajewels.com/product.html">
<meta property="og:image" content="https://www.venorajewels.com/images/brand/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/images/brand/icon-192.png">
<link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#2f0719">
<!-- 360° 3D viewer (js/viewer3d.js) — switched off for now. To turn it back on, restore
     "model3d: true" on a product in js/products.js; this import map stays for the viewer. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js"
} }
</script>
</head>
<body data-page="collections">
<header id="site-header"></header>

<main>
  <section class="tight">
    <div class="wrap" id="product"></div>
  </section>

  <section class="alt tight" id="relatedWrap">
    <div class="wrap">
      <div class="section-head"><h2>You may also love</h2></div>
      <div class="grid" id="related"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/config.js?v=202610051337"></script>
<script src="js/products.js?v=202610051337"></script>
<script src="js/main.js?v=202610051337"></script>
<script>
  const { esc, waLink, ICON, artSvg, productCard, priceText, enquiryText, COLOURS, colourCodes, photo, thumbPhoto, swatches } = Venora;
  const TRYON_ICON = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2"/><circle cx="12" cy="11" r="3.5"/><path d="M7.5 18c.8-2.2 2.5-3.3 4.5-3.3s3.7 1.1 4.5 3.3"/></svg>';
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const root = document.getElementById("product");

  function notFound(loggedIn) {
    root.innerHTML = loggedIn === false
      ? `<div class="empty"><h1>Members-only design</h1><p>Log in to see this design and our full collection.</p><a class="btn btn-dark" href="account.html">Login / Sign up</a></div>`
      : `<div class="empty"><h1>Design not available</h1><p>This piece may have moved, or isn't shared with your account right now.</p><a class="btn btn-dark" href="collections.html">View Collections</a></div>`;
    const rel = document.getElementById("relatedWrap"); if (rel) rel.hidden = true;
  }

  const publicProduct = PRODUCTS.find(x => x.code === code);
  if (publicProduct) renderProduct(publicProduct);
  else root.innerHTML = `<p class="center muted" style="padding:60px 0">Loading…</p>`;

  function renderProduct(p) {
    // library designs may have no written text yet — fall back to the standard wording
    p = { options: { "Gold purity": ["14KT", "18KT", "9KT"] }, details: { "Diamond": "Lab grown, IGI certified" },
          ...p, description: p.description || Venora.DEFAULT_DESC };
    document.title = p.name + " | Venora Jewels";
    const colours = colourCodes(p);
    let colour = colours.includes(params.get("colour")) ? params.get("colour") : (colours.includes(p.colour) ? p.colour : colours[0]);

    // Gold colour first, then the product's other options
    const choices = {};
    if (colour) choices["Gold colour"] = COLOURS[colour];
    Object.entries(p.options || {}).forEach(([k, v]) => { choices[k] = v[0]; });

    root.innerHTML = `
      <p class="crumbs"><a href="index.html">Home</a> / <a href="collections.html">Collections</a> / <a href="collections.html?cat=${encodeURIComponent(p.category)}">${esc(p.category)}</a> / ${esc(p.name)}</p>
      <div class="product">
        <div class="gallery">
          <div class="gallery-main" id="mainImg">${colour ? "" : artSvg(p.category)}</div>
          <div class="thumbs" id="thumbs"></div>
        </div>
        <div class="product-info">
          <span class="eyebrow">${esc(p.category)}</span>
          <h1>${esc(p.name)}</h1>
          <span class="code">Design code: ${esc(p.code)}</span>
          <p class="price">${esc(priceText(p))}</p>
          <p class="desc">${esc(p.description)}</p>
          ${colour ? `
            <div class="opt">
              <div class="opt-label">Gold colour <b id="colourLabel">${esc(COLOURS[colour])}</b></div>
              <div class="colour-chips" id="colourChips">
                ${colours.map(c => `<button type="button" class="${c === colour ? "active" : ""}" data-colour="${c}" aria-pressed="${c === colour}"><i class="dot dot-${c.toLowerCase()}"></i>${esc(COLOURS[c])}</button>`).join("")}
              </div>
            </div>` : ""}
          ${Object.entries(p.options || {}).map(([k, vals]) => `
            <div class="opt">
              <div class="opt-label">${esc(k)} <b data-opt-label="${esc(k)}">${esc(vals[0])}</b></div>
              <div class="chips" data-opt="${esc(k)}">
                ${vals.map((v, i) => `<button type="button" class="${i === 0 ? "active" : ""}" data-val="${esc(v)}">${esc(v)}</button>`).join("")}
              </div>
            </div>`).join("")}
          <div class="product-actions">
            <a class="btn btn-wa" id="enquire" target="_blank" rel="noopener">${ICON.whatsapp} Enquire on WhatsApp</a>
            ${colour || p.photo ? `<a class="btn btn-gold" id="tryon">${TRYON_ICON} Try it on</a>` : ""}
            <a class="btn btn-ghost" id="consult" href="contact.html?product=${encodeURIComponent(p.code)}#consultation">${ICON.calendar} Book a Consultation</a>
          </div>
          <table class="spec">
            ${Object.entries(p.details || {}).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}
          </table>
          <div class="assure">
            <div><strong>IGI certified</strong>Graded diamond</div>
            <div><strong>Hallmarked</strong>9KT · 14KT · 18KT</div>
            <div><strong>Your colour</strong>Rose · White · Yellow</div>
          </div>
        </div>
      </div>`;

    const enquire = document.getElementById("enquire");
    const tryBtn = document.getElementById("tryon");
    const update = () => {
      enquire.href = waLink(enquiryText(p, choices));
      if (tryBtn) tryBtn.href = "tryon.html?code=" + encodeURIComponent(p.code) + (colour ? "&colour=" + colour : "");
    };
    // the try-on page also needs members'/set designs that aren't in the public list
    if (tryBtn) tryBtn.addEventListener("click", () => {
      try { sessionStorage.setItem("venora-tryon", JSON.stringify(window.clientItem ? window.clientItem(p) : p)); } catch (e) {}
    });

    // Gallery for the selected gold colour (+ a 360° 3D view for designs that have a 3D model)
    const mainImg = document.getElementById("mainImg");
    const thumbs = document.getElementById("thumbs");
    let viewer3d = null, showing3d = !!p.model3d;
    let firstPhoto = true;
    function show3d() {
      showing3d = true;
      if (viewer3d) { viewer3d.stop(); viewer3d = null; }
      mainImg.innerHTML = `<div class="viewer3d" id="viewer3d"><p class="v3d-note">Loading 3D view…</p></div>`;
      const el = document.getElementById("viewer3d");
      const media = window.VENORA.media.replace(/\/$/, "");
      import("./js/viewer3d.js?v=202610051337").then(m => m.mountViewer(el, {
        glb: `${media}/models/${encodeURIComponent(p.code)}.glb`, hdr: `${media}/models/studio.hdr`, gold: colour || "Y"
      })).then(v => {
        if (!showing3d) return v.stop();
        viewer3d = v;
        el.querySelector(".v3d-note").textContent = "Drag to rotate · scroll or pinch to zoom";
      }).catch(() => { el.querySelector(".v3d-note").textContent = "3D view could not load on this device."; });
    }
    function hide3d() {
      showing3d = false;
      if (viewer3d) { viewer3d.stop(); viewer3d = null; }
    }
    function showGallery() {
      if (!colour) {
        if (p.photo) { mainImg.innerHTML = `<img src="${photo(p)}" alt="${esc(p.name)}">`; thumbs.innerHTML = ""; }
        return;
      }
      const views = Array.from({ length: p.views }, (_, i) => i + 1);
      if (showing3d && viewer3d) viewer3d.setGold(colour);            // keep the 3D view, just recolour it
      else if (showing3d) show3d();
      else mainImg.innerHTML = `<img${firstPhoto ? ' class="vt"' : ""} src="${photo(p, colour, 1)}" alt="${esc(p.name)} in ${esc(COLOURS[colour])}">`;
      firstPhoto = false;
      const btn3d = p.model3d ? `<button class="thumb-3d${showing3d ? " active" : ""}" data-three="1" aria-label="360 degree 3D view"><span>360°</span><small>3D</small></button>` : "";
      thumbs.innerHTML = btn3d + (views.length > 1 || p.model3d ? views.map(n =>
        `<button class="${n === 1 && !showing3d ? "active" : ""}" data-src="${photo(p, colour, n)}" aria-label="View image ${n}"><img src="${thumbPhoto(p, colour, n)}" alt="" loading="lazy"></button>`).join("") : "");
      // preload the other colours' first photo so switching feels instant
      colours.filter(c => c !== colour).forEach(c => { new Image().src = photo(p, c, 1); });
    }
    showGallery();
    update();

    thumbs.addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      thumbs.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));
      if (btn.dataset.three) return show3d();
      if (showing3d) { hide3d(); mainImg.innerHTML = `<img alt="${esc(p.name)}">`; }
      mainImg.querySelector("img").src = btn.dataset.src;
    });

    const colourChips = document.getElementById("colourChips");
    if (colourChips) colourChips.addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      colour = btn.dataset.colour;
      colourChips.querySelectorAll("button").forEach(b => { b.classList.toggle("active", b === btn); b.setAttribute("aria-pressed", b === btn); });
      document.getElementById("colourLabel").textContent = COLOURS[colour];
      choices["Gold colour"] = COLOURS[colour];
      history.replaceState(null, "", "?code=" + encodeURIComponent(p.code) + "&colour=" + colour);
      showGallery();
      update();
    });

    root.querySelectorAll(".chips").forEach(group => {
      group.addEventListener("click", e => {
        const btn = e.target.closest("button");
        if (!btn) return;
        group.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const key = group.dataset.opt;
        choices[key] = btn.dataset.val;
        root.querySelector(`[data-opt-label="${CSS.escape(key)}"]`).textContent = btn.dataset.val;
        update();
      });
    });

    const related = PRODUCTS.filter(x => x.category === p.category && x.code !== p.code)
      .concat(PRODUCTS.filter(x => x.category !== p.category))
      .slice(0, 4);
    document.getElementById("related").innerHTML = related.map(productCard).join("");
  }
</script>
<script src="js/firebase-config.js?v=202610051337"></script>
<script src="js/library.js?v=202610051337"></script>
<script type="module">
  import { loadCatalogue } from "./js/auth.js?v=202610051337";
  let shown = false;
  document.addEventListener("venora-auth", async e => {
    const st = e.detail;
    // Designs not in the public list: members' catalogue, the customer's private sets, or (admins) the full library
    if (!PRODUCTS.some(x => x.code === code) && !shown) {
      if (!st.user) return notFound(false);
      const fromSets = st.sets.flatMap(s => s.items || []);
      const member = st.catalogueOpen ? await loadCatalogue() : [];
      let p = [...fromSets, ...member].find(x => x.code === code);
      if (!p && st.isAdmin) p = (await loadLibrary().catch(() => [])).find(x => x.code === code);
      if (!p) return notFound(true);
      renderProduct(window.clientItem(p));
      shown = true;
    }
    // CAD sheet: admins only
    if (st.isAdmin && !document.getElementById("cadBlock")) {
      const item = (await loadLibrary().catch(() => [])).find(x => x.code === code);
      const gallery = document.querySelector("#product .gallery");
      if (item && item.cad && gallery) {
        gallery.insertAdjacentHTML("beforeend", `
          <div class="cad-block" id="cadBlock">
            <div class="cad-head"><b>CAD design sheet</b><span class="pill">Admin only · private</span></div>
            <p class="muted" id="cadLoading">Loading CAD sheet…</p>
          </div>`);
        loadCadImage(item).then(url => {
          document.getElementById("cadLoading").outerHTML = `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="CAD design sheet for ${Venora.esc(code)}"></a>`;
        }).catch(e => { document.getElementById("cadLoading").textContent = e.message; });
      }
    }
  });
</script>
</body>
</html>
